name: kookaburra-relay
services:
  gateway:
    image: ${GATEWAY_IMAGE:-kookaburra-relay:local}
    build: .
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    init: true
    stop_grace_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GATEWAY_DATABASE_URL: postgresql://kookaburra:${POSTGRES_PASSWORD:?Run install.sh first}@postgres:5432/kookaburra
      GATEWAY_DATABASE_SCHEMA: relay
      GATEWAY_TRUSTED_PROXIES: ${GATEWAY_TRUSTED_PROXIES:-}
      GATEWAY_BACKUP_INTERVAL_SECONDS: ${GATEWAY_BACKUP_INTERVAL_SECONDS:-86400}
      GATEWAY_BACKUP_RETENTION_DAYS: ${GATEWAY_BACKUP_RETENTION_DAYS:-14}
    ports:
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-3220}:3220"
    volumes:
      - kookaburra-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      POSTGRES_USER: kookaburra
      POSTGRES_DB: kookaburra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run install.sh first}
    volumes:
      - kookaburra-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kookaburra -d kookaburra"]
      interval: 5s
      timeout: 3s
      retries: 10
  backup:
    image: ${GATEWAY_BACKUP_IMAGE:-kookaburra-relay-backup:local}
    build:
      context: .
      dockerfile: Dockerfile.backup
    restart: unless-stopped
    init: true
    depends_on:
      gateway:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      GATEWAY_DATABASE_URL: postgresql://kookaburra:${POSTGRES_PASSWORD:?Run install.sh first}@postgres:5432/kookaburra
      GATEWAY_DATABASE_SCHEMA: relay
      GATEWAY_DATA_DIR: /gateway-data
      PGHOST: postgres
      PGDATABASE: kookaburra
      PGUSER: kookaburra
      PGPASSWORD: ${POSTGRES_PASSWORD:?Run install.sh first}
    volumes:
      - kookaburra-data:/gateway-data:ro
      - ./.env:/gateway-config.env:ro
      - ./ops:/ops:ro
      - ${GATEWAY_BACKUP_DIR:-./backups}:/backups
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "sh", "/ops/backup-health.sh"]
      interval: 60s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  kookaburra-postgres:
  kookaburra-data:
